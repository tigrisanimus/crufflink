[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crufflink"
version = "0.1.0"
description = "Shared terminal + chat bridge between your computer and Cruffalo Crill (Muse)."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
crufflink = "crufflink.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crufflink*"]
